[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rig-workbench"
version = "2.2.0"
description = "rig — an AI Quality Operating System that runs anywhere. Install as a pip package; drop into Claude Code / Codex / Cursor as a skill; recipe-driven workflow with force-proof accept, cross-LLM verifier, and isolated worktrees — now with an org layer: a common policy that only tightens downstream, role-based permissions, approvals with separation of duties, expiring waivers, and a tamper-evident audit ledger."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "sito-plugins" }
]
keywords = [
  "ai", "coding-agent", "orchestration", "harness",
  "claude-code", "codex", "workbench", "cross-llm",
  "governance", "policy", "rbac", "audit", "compliance",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "cryptography>=41",                  # Ed25519 publisher pack signatures
  "pyyaml>=6.0",                        # recipe frontmatter parsing (orchestrate.py, validate.py)
  "pytest>=7",                          # packaged Python benchmark task execution
]

[project.optional-dependencies]
dev = [
  "ruff>=0.5",
  "setuptools>=68",
  "wheel",
  "tomli; python_version < \"3.11\"",
]

[project.urls]
Homepage = "https://github.com/itoh-shun/rig"
Repository = "https://github.com/itoh-shun/rig"
Changelog = "https://github.com/itoh-shun/rig/blob/master/CHANGELOG.md"

[project.scripts]
rig-wb = "rig_workbench.cli:main"       # pip installer 経由の CLI entrypoint

# ── パッケージ探索 ──────────────────────────────────────────────
# rig_workbench/ を Python パッケージとして拾う。scripts/*.py は
# 従来通り Claude Code plugin から呼ばれる場所に残す（bin/orchestrate
# shim も互換のため維持）。パッケージ側 cli.py が scripts/*.py の
# main() を importlib で薄く呼び出す。
[tool.setuptools.packages.find]
where = ["."]
include = ["rig_workbench*", "benchmarks*", "skills*", "packs*"]
exclude = ["tests*", "docs*", "video*", "web*"]

[tool.setuptools.package-data]
rig_workbench = ["py.typed", "packs/trust-roots.json"]
benchmarks = [
  "tasks/**/*.json",
  "tasks/**/*.py",
  "tasks/**/*.ts",
  "tasks/**/*.txt",
]
"skills.engine" = [
  "SKILL.md",
  "agents/*.yaml",
  # drill fixture corpus: the answer keys plus the base/head trees they score
  "corpora/**/*.json",
  "corpora/**/*.md",
  "corpora/**/*.py",
  "corpora/**/*.ts",
  "facets/**/*.md",
  "manifests/*.md",
  "patterns/*.md",
  "recipes/*.md",
  "templates/*.md",
]
packs = ["domain/**/*", "official/**/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
