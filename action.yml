name: 'rig'
description: >-
  Run a rig task headlessly in CI — isolated worktree, acceptance-gate, and
  (optionally) an auto-opened PR only when the gate passes. Wraps
  `scripts/orchestrate.py run --isolate`; does not implement its own
  execution engine.
author: 'sito-plugins'

inputs:
  task:
    description: 'Natural-language goal passed to the recipe (--goal).'
    required: true
  recipe:
    description: 'Recipe file or name to run (e.g. recipes/bugfix.md, or a name resolvable by orchestrate.py).'
    required: true
  provider:
    description: 'Generator/verifier provider (claude, codex, ollama, lmstudio, cmd, mock).'
    required: false
    default: 'mock'
  verifier_provider:
    description: 'Verifier provider, if different from `provider`.'
    required: false
    default: ''
  model:
    description: 'Optional --model override passed through to orchestrate.py.'
    required: false
    default: ''
  max_steps:
    description: 'Optional --max-steps override.'
    required: false
    default: ''
  auto_pr:
    description: 'If "true", push the isolated branch and open a PR when the gate passes. Never happens on gate failure.'
    required: false
    default: 'false'
  anthropic_api_key:
    description: 'ANTHROPIC_API_KEY, forwarded to the environment when provider needs it. Pass via secrets.'
    required: false
    default: ''
  github_token:
    description: 'Token used for `gh pr create` when auto_pr is true. Defaults to the workflow token.'
    required: false
    default: ${{ github.token }}

outputs:
  final:
    description: 'Final orchestrate.py state (DONE, ESCALATE, BLOCKED, STOPPED).'
    value: ${{ steps.run.outputs.final }}
  pr_url:
    description: 'URL of the PR opened by auto_pr (empty if not created).'
    value: ${{ steps.pr.outputs.pr_url }}

runs:
  using: 'composite'
  steps:
    # gh-stack is optional for rig (rig_workbench/gh_requirement.py), but a CI
    # runner is exactly where having it costs nothing: hosted runners ship `gh`
    # without the extension, so install it and let stacked-PR publishing work.
    # --force is the idempotent form ("ignore if latest already installed").
    # The token is for fetching the extension release only — never for a check,
    # and deliberately not exposed to the step that runs the model.
    #
    # "Optional" has to hold here too. Composite steps run under `bash -eo
    # pipefail` and cannot use continue-on-error, so both ways this step can die
    # are handled in the shell: a runner without `gh` at all (self-hosted), and
    # an install that fails on auth, rate limiting or a flaky network. Neither
    # may take the rig task down with it — nothing after this needs the extension.
    - name: Install gh-stack (optional; enables stacked-PR publishing)
      id: gh
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
      run: |
        if ! command -v gh >/dev/null 2>&1; then
          echo "gh is not installed on this runner; skipping gh-stack (rig runs without it)."
          exit 0
        fi
        if ! gh extension install github/gh-stack --force; then
          echo "gh-stack install failed; continuing without it (rig runs without it)."
        fi

    - name: Run rig task (isolated worktree + acceptance-gate)
      id: run
      shell: bash
      env:
        ANTHROPIC_API_KEY: ${{ inputs.anthropic_api_key }}
        RIG_TASK: ${{ inputs.task }}
        RIG_RECIPE: ${{ inputs.recipe }}
        RIG_PROVIDER: ${{ inputs.provider }}
        RIG_VERIFIER_PROVIDER: ${{ inputs.verifier_provider }}
        RIG_MODEL: ${{ inputs.model }}
        RIG_MAX_STEPS: ${{ inputs.max_steps }}
      run: |
        "${GITHUB_ACTION_PATH}/scripts/rig-action-entrypoint.sh" run
      # The real logic lives in the entrypoint script (no long shell inline in action.yml).

    - name: Open PR on green gate (auto_pr only)
      id: pr
      if: ${{ inputs.auto_pr == 'true' && steps.run.outputs.final == 'DONE' }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
        RIG_TASK: ${{ inputs.task }}
      run: |
        "${GITHUB_ACTION_PATH}/scripts/rig-action-entrypoint.sh" open-pr
