name: validate

# Quality gates for the repo itself: structural validator (+ its selftest),
# orchestrator selftest, ruff lint, and the pytest suite.
# Any failure blocks the PR / rejects the master push.

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'

      - name: Install dependencies
        run: pip install pyyaml 'ruff==0.15.8' pytest setuptools wheel 'tomli; python_version < "3.11"'

      - name: Lint (ruff)
        run: ruff check scripts rig_workbench tests

      - name: Run rig structural validator
        run: python3 scripts/validate.py

      - name: Run rig structural validator selftest (fixture regression)
        run: python3 scripts/validate.py selftest

      - name: Verify the coverage map against the repository
        run: python3 -m rig_workbench.cli coverage

      - name: Verify the ASVS map against the repository
        run: python3 -m rig_workbench.cli asvs --check

      - name: Run computational orchestrator selftest (determinism)
        run: python3 scripts/orchestrate.py selftest

      # Raising a per-subprocess budget buys stability at the cost of slower hang
      # detection, and those `timeout=` values were the only bound on a wedged
      # child here — without a step budget the fallback is Actions' 6-hour job
      # default. The observed suite is ~1950s, so 90 minutes keeps ~2.8x headroom
      # while still failing a genuine hang in minutes rather than hours.
      - name: Run pytest suite
        timeout-minutes: 90
        run: pytest -q

  prompt-evaluation:
    name: prompt evaluation gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Declared dependencies only, no optional extras. `--no-deps` skips *all* of
      # them, including pyyaml, which `eval affected` needs to read recipe
      # frontmatter — under that flag this job fails before it evaluates anything.
      - name: Install rig with its declared dependencies (no optional extras)
        run: pip install -e .

      # Ask git what the base branch's tip is now; do not take the payload's word
      # for it. `github.event.pull_request.base.sha` is a snapshot of the base
      # branch from when the event fired, and an author who opens the PR before a
      # revert lands pins it there for the life of the PR. The damage is not only
      # that the evidence ratchet then compares against the very measurement it
      # exists to refuse — the diff is taken from `merge-base(base, head)`, so a
      # head restored to the pinned commit's content drops the surface out of the
      # diff entirely and the case is never selected. Nothing in this job runs.
      #
      # A push is the opposite case and must keep `github.event.before`: there,
      # `origin/<branch>` *is* the commit being gated, so resolving the live tip
      # would diff the push against itself and this job would be `noop` forever.
      # `before` is the tip the push replaced, chosen by the server at push time
      # and not something a branch can hold stale.
      - name: Resolve comparison base
        id: comparison
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          PUSH_BASE: ${{ github.event.before }}
        run: |
          if [ -n "$BASE_REF" ]; then
            # `fetch-depth: 0` fetches every branch, so the remote-tracking ref is
            # normally already here. Re-fetching is the cheap guarantee that it
            # is, and it also picks up whatever landed after this job started.
            if ! git fetch --no-tags --quiet origin \
                "+refs/heads/${BASE_REF}:refs/remotes/origin/${BASE_REF}"; then
              echo "::warning::could not fetch ${BASE_REF}; falling back to the ref this checkout already has"
            fi
            base="$(git rev-parse --verify --quiet "refs/remotes/origin/${BASE_REF}^{commit}")" || base=
          else
            base="$PUSH_BASE"
          fi
          # Fail closed rather than fall back. Every fallback available here is a
          # value the branch under review can influence, which is the hole this
          # step was rewritten to close.
          case "$base" in
            "" | *[!0-9a-f]*) base= ;;
          esac
          if [ -z "$base" ] || [ "${#base}" -ne 40 ]; then
            echo "Cannot resolve prompt evaluation base for ${BASE_REF:-push}." >&2
            exit 2
          fi
          echo "Comparing against $base"
          echo "base=$base" >> "$GITHUB_OUTPUT"

      # Ratchet, not threshold. `--require-cases` fails every change that touches a
      # prompt surface while `evals/cases/` is empty — including the change that
      # would add the first case — so it fired on everything and was merged past.
      # `--ratchet` keeps the same requirement as a direction: a surface with no
      # case yet is debt (reported, exit 0), removing coverage somebody earned is a
      # regression (exit 1), and an unregistered surface kind still fails outright.
      - name: Structural affected-case coverage (free)
        run: |
          rig-wb eval affected --base "${{ steps.comparison.outputs.base }}" \
            --head HEAD --ratchet --json > /tmp/rig-affected.json
          cat /tmp/rig-affected.json
          python3 - <<'PY'
          import json
          report = json.load(open("/tmp/rig-affected.json"))
          debt = report["coverage_debt"]
          if debt:
              print(f"::warning::prompt coverage debt: {len(debt)} surface(s) have no "
                    f"evaluation case yet — {', '.join(debt)}")
          # The registry is monotonic like the cases are. Widening it is the direction
          # the gate is meant to move and is only announced; narrowing it already
          # failed the command above, and is named here so the reason is in the log
          # rather than only in an exit code.
          for line in report.get("registry_narrowings") or []:
              print(f"::error::prompt surface registry narrowed — {line}")
          if report.get("registry_changed") and not report.get("registry_narrowings"):
              print("::notice::prompt surface registry widened; the gate now sees more "
                    "than it did on the base commit")
          PY

      - name: Untrusted or fork prompt quality handoff
        if: >-
          github.event_name == 'pull_request' &&
          (github.event.pull_request.head.repo.full_name != github.repository ||
          (github.event.pull_request.author_association != 'OWNER' &&
          github.event.pull_request.author_association != 'MEMBER' &&
          github.event.pull_request.author_association != 'COLLABORATOR'))
        run: |
          runnable="$(python3 -c 'import json; r=json.load(open("/tmp/rig-affected.json")); print(len(r["affected_cases"]))')"
          if [ "$runnable" = "0" ]; then
            # Either no prompt surface changed, or every affected surface is still
            # coverage debt. There is no case to run either way, and demanding a
            # quality run with nothing to measure is what made this gate fire on
            # everything. The debt itself is already reported by the step above.
            echo "No affected evaluation case to run; structural-only fork check is complete."
            exit 0
          fi
          echo "Prompt quality remains intentionally unmet for an untrusted/fork PR." >&2
          echo "Maintainer: check out the PR head on an origin branch, then run: rig-wb eval affected-run --base ${{ steps.comparison.outputs.base }} --head HEAD --ratchet --provider <trusted-provider> --model <model> --judge-provider <trusted-judge> --judge-model <judge-model>" >&2
          echo "Then commit the signed evidence written under evals/evidence/ and push it; this job verifies that evidence rather than measuring anything itself." >&2
          exit 1

      # Verification, not measurement. This step used to drive `affected-run`,
      # which starts the provider as an external binary — none is installed on the
      # runner and none is authenticated there, so the step could not pass even
      # with all five secrets set, and #402 was merged red on exactly that. The
      # measurement is now a maintainer's, run locally against real providers and
      # signed; CI recomputes the binding and checks the signature, which needs
      # nothing but git and one key.
      - name: Trusted prompt quality evidence
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          (github.event.pull_request.author_association == 'OWNER' ||
          github.event.pull_request.author_association == 'MEMBER' ||
          github.event.pull_request.author_association == 'COLLABORATOR'))
        env:
          RIG_EVAL_ATTESTATION_KEY: ${{ secrets.RIG_EVAL_ATTESTATION_KEY }}
          RIG_EVAL_PROVIDER: ${{ secrets.RIG_EVAL_PROVIDER }}
          RIG_EVAL_MODEL: ${{ secrets.RIG_EVAL_MODEL }}
          RIG_EVAL_JUDGE_PROVIDER: ${{ secrets.RIG_EVAL_JUDGE_PROVIDER }}
          RIG_EVAL_JUDGE_MODEL: ${{ secrets.RIG_EVAL_JUDGE_MODEL }}
        run: |
          runnable="$(python3 -c 'import json; r=json.load(open("/tmp/rig-affected.json")); print(len(r["affected_cases"]))')"
          if [ "$runnable" = "0" ]; then
            echo "No affected evaluation case to run; quality gate is a no-op."
            exit 0
          fi
          # Fail closed on the key alone. Without it no signature can be checked,
          # and a gate that shrugs when it cannot verify is not a gate. The four
          # provider secrets are no longer required — nothing here runs a provider
          # — but they still pin the evidence when they are set; unset, the case's
          # own `provider_policy` and the standing ban on mock evidence apply.
          if [ -z "$RIG_EVAL_ATTESTATION_KEY" ]; then
            echo "Prompt quality evidence requires a trusted maintainer run. Fork authors: ask a maintainer to run 'rig-wb eval affected-run' with trusted provider and judge credentials and commit the signed evidence; missing evidence cannot pass." >&2
            exit 1
          fi
          # Checked here as well as in the library, because this job hands the key
          # to `rig-wb` as a *file* and the shape rule lives on the environment
          # path. The repository is public and committed evidence publishes
          # `key_id = sha256(key)[:16]`, so a memorable secret is an offline
          # guessing oracle that ends in outright forgery by an outsider. The
          # value is never echoed.
          case "$RIG_EVAL_ATTESTATION_KEY" in
            *[!0-9a-fA-F]*) shaped=no ;;
            *) shaped=yes ;;
          esac
          if [ "$shaped" != yes ] || [ "${#RIG_EVAL_ATTESTATION_KEY}" -ne 64 ]; then
            echo "RIG_EVAL_ATTESTATION_KEY must be 64 hex characters, as produced by 'openssl rand -hex 32'. Regenerate the secret and re-sign the evidence." >&2
            exit 1
          fi
          state_dir="$(mktemp -d)"
          mkdir -p "$state_dir/rig"
          chmod 700 "$state_dir/rig"
          printf '%s' "$RIG_EVAL_ATTESTATION_KEY" > "$state_dir/rig/eval-attestation.key"
          chmod 600 "$state_dir/rig/eval-attestation.key"
          unset RIG_EVAL_ATTESTATION_KEY
          export XDG_STATE_HOME="$state_dir"
          # `if` rather than `[ ... ] && ...`: this shell runs with `-e`, where a
          # false test is a failing command and would abort the step whenever an
          # optional secret is unset.
          # `--ratchet`, matching the structural step above. Strict here would fail
          # any PR that touches one covered surface alongside any of the ~198 that
          # have no case yet — `uncovered:<path>`, unfixable by evidence — so the
          # two steps in this job would be enforcing opposite policies. The
          # evidence checks are the same in either mode.
          set -- eval gate --base "${{ steps.comparison.outputs.base }}" \
            --head HEAD --evidence-dir evals/evidence --ratchet
          if [ -n "$RIG_EVAL_PROVIDER" ]; then set -- "$@" --provider "$RIG_EVAL_PROVIDER"; fi
          if [ -n "$RIG_EVAL_MODEL" ]; then set -- "$@" --model "$RIG_EVAL_MODEL"; fi
          if [ -n "$RIG_EVAL_JUDGE_PROVIDER" ]; then set -- "$@" --judge-provider "$RIG_EVAL_JUDGE_PROVIDER"; fi
          if [ -n "$RIG_EVAL_JUDGE_MODEL" ]; then set -- "$@" --judge-model "$RIG_EVAL_JUDGE_MODEL"; fi
          rig-wb "$@"
